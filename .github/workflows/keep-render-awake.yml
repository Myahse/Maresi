# Pings the Render API so the free web service does not sleep after 15 minutes idle.
# Also wakes a cold instance (an in-app job cannot start if Render has already spun down).
#
# GitHub cron is best-effort. */5 at :00/:05 is often delayed or dropped, so this uses
# staggered minutes instead. A push to main re-registers the schedule.
name: Keep Render awake

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          echo "trigger=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --max-time 90 \
            -H "User-Agent: Maresi-GitHubKeepAlive" \
            "https://maresi.onrender.com/api/health"
