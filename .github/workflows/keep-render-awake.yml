# Pings the Render API so the free web service does not sleep after 15 minutes idle.
# Also wakes a cold instance (an in-app job cannot start if Render has already spun down).
name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          curl -fsS --retry 2 --retry-delay 20 --max-time 90 \
            -H "User-Agent: Maresi-GitHubKeepAlive" \
            "https://maresi.onrender.com/api/health"
