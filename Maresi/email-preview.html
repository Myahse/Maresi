<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Templates e-mail Maresi</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: Manrope, "Segoe UI", Arial, sans-serif; background: #e7f0ee; color: #0f172a; }
    header { padding: 28px 20px 4px; text-align: center; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 8px 0 0; color: #64748b; font-size: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 16px 16px 8px; }
    nav a { font-size: 12px; font-weight: 700; color: #0D9488; text-decoration: none; background: #fff; border: 1px solid #cfe0dc; border-radius: 999px; padding: 6px 10px; }
    .grid { display: grid; gap: 32px; padding: 16px 16px 48px; max-width: 640px; margin: 0 auto; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #0D9488; margin-bottom: 8px; }
    iframe { width: 100%; height: 640px; border: 0; background: transparent; }
  </style>
</head>
<body>
  <header>
    <h1>Un template par cas</h1>
    <p>Même HTML que l’API envoie. Données d’exemple.</p>
  </header>
  <nav id="nav"></nav>
  <div class="grid" id="grid"></div>
  <script>
    const paras = (...parts) => parts.map((t) =>
      `<p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#334155;">${t}</p>`
    ).join("");

    const rows = (pairs) => {
      if (!pairs || !pairs.length) return "";
      let html = `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:4px 0 24px;border-top:1px solid #e2e8f0;">`;
      pairs.forEach(([label, value]) => {
        html += `<tr><td style="padding:11px 0;font-size:13px;color:#64748b;width:38%;border-bottom:1px solid #e2e8f0;vertical-align:top;">${label}</td><td style="padding:11px 0;font-size:14px;font-weight:600;color:#0f172a;border-bottom:1px solid #e2e8f0;">${value}</td></tr>`;
      });
      return html + `</table>`;
    };

    const highlight = (label, value) =>
      `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;"><tr><td style="background:#f8fafc;border:1px solid #e2e8f0;padding:16px 18px;"><p style="margin:0 0 6px;font-size:12px;color:#64748b;">${label}</p><p style="margin:0;font-size:28px;letter-spacing:.16em;font-weight:700;color:#0f172a;">${value}</p></td></tr></table>`;

    const layout = (kicker, title, body, extra, cta) => {
      const button = cta
        ? `<table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 20px;"><tr><td style="background:#0D9488;"><a href="#" style="display:inline-block;padding:11px 18px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">${cta}</a></td></tr></table>`
        : "";
      return `<!DOCTYPE html><html lang="fr"><body style="margin:0;padding:0;background:#f4f4f5;font-family:Manrope,'Segoe UI',Arial,sans-serif;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:28px 12px;"><tr><td align="center"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;"><tr><td style="padding:28px 28px 0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="font-size:15px;font-weight:700;color:#0D9488;">Maresi</td><td align="right" style="font-size:12px;color:#71717a;">${kicker}</td></tr></table><div style="margin:16px 0 0;border-top:1px solid #e4e4e7;font-size:0;line-height:0;">&nbsp;</div><h1 style="margin:20px 0 16px;font-size:20px;line-height:1.35;font-weight:600;color:#18181b;">${title}</h1>${body}${extra || ""}${button}</td></tr><tr><td style="padding:8px 28px 28px;"><div style="border-top:1px solid #e4e4e7;padding-top:16px;"><p style="margin:0;font-size:12px;line-height:1.5;color:#71717a;">Maresi · Abidjan</p><p style="margin:6px 0 0;font-size:12px;line-height:1.5;color:#a1a1aa;">Message automatique. Pour une question sur un séjour, écrivez à l’hôte dans l’application.</p></div></td></tr></table></td></tr></table></body></html>`;
    };

    const cases = [
      ["welcome-guest", "Bienvenue client", layout("Compte", "Bienvenue chez vous", paras("Bonjour Awa,", "Votre compte Maresi est prêt. Explorez les résidences à Abidjan, comparez les quartiers et réservez en quelques étapes.", "Gardez votre téléphone à portée : l’hôte vous contacte souvent par WhatsApp ou appel."), rows([["Voyageur", "Awa Kouassi"], ["Téléphone", "+225 07 00 00 00 00"]]), "Voir les résidences")],
      ["welcome-host", "Bienvenue hôte", layout("Compte hôte", "Votre espace hôte est ouvert", paras("Bonjour,", "Votre compte hôte Maresi est prêt. Publiez une résidence, recevez des demandes et suivez chaque séjour depuis Maresi Hôte.", "Pensez à indiquer vos horaires d’arrivée et de départ, puis vos liens Wave ou Orange Money."), rows([["Téléphone", "+225 07 00 00 00 00"]]), "Ouvrir Maresi Hôte")],
      ["reservation-sent", "Demande envoyée", layout("Réservation", "Votre demande est partie", paras("Bonjour,", "Nous avons bien transmis votre demande à l’hôte. Vous recevrez un e-mail dès qu’il accepte ou refuse.", "En attendant, rien n’est encore confirmé : ne partez pas et n’effectuez aucun paiement."), rows([["Résidence", "Villa Cocody"]]))],
      ["reservation-new", "Nouvelle réservation", layout("Réservation", "Awa Kouassi souhaite réserver", paras("Bonjour,", "Awa Kouassi a demandé votre résidence. Vérifiez son dossier (selfie, pièce d’identité), puis acceptez ou refusez dans les 48 heures.", "S’il n’est pas le bon profil, refusez simplement : le client sera prévenu."), rows([["Voyageur", "Awa Kouassi"], ["Résidence", "Villa Cocody"], ["Arrivée", "2026-09-10"], ["Départ", "2026-09-14"], ["Téléphone", "+225 05 11 22 33 44"], ["Pièce d’identité", "CI123456789"]]), "Voir la demande")],
      ["reservation-accepted", "Demande acceptée", layout("Réservation", "Bonne nouvelle : l’hôte a accepté", paras("Bonjour,", "Votre demande a été acceptée. Signez maintenant l’engagement de soin du logement.", "Ensuite, vous recevrez un code à 6 chiffres à donner à l’hôte pour récupérer la clé. Le paiement se fait ensuite directement à l’hôte (Wave ou Orange Money)."), rows([["Résidence", "Villa Cocody"], ["Prochaine étape", "Signer l’engagement"]]), "Signer l’engagement")],
      ["reservation-declined", "Demande refusée", layout("Réservation", "Cette demande n’a pas abouti", paras("Bonjour,", "L’hôte a refusé votre demande. Ce n’est pas un blocage de votre compte : vous pouvez chercher une autre résidence tout de suite.", "Les disponibilités changent souvent à Abidjan, une autre option peut se libérer aujourd’hui."), rows([["Résidence", "Villa Cocody"]]))],
      ["key-host", "Code clé hôte", layout("Clé", "Awa Kouassi a signé. Entrez le code", paras("Bonjour,", "Awa Kouassi a signé l’engagement. Demandez-lui son code à 6 chiffres, saisissez-le dans Maresi Hôte, puis il pourra vous payer.", "Ne communiquez jamais ce code à une autre personne."), rows([["Voyageur", "Awa Kouassi"], ["Résidence", "Villa Cocody"], ["À faire", "Saisir le code à 6 chiffres"]]), "Saisir le code")],
      ["key-guest", "Code clé client", layout("Clé", "Voici votre code clé", paras("Bonjour,", "Votre engagement est enregistré. Donnez uniquement ce code à l’hôte pour récupérer la clé, puis payez-le dans Maresi.", "Gardez ce message : sans ce code, l’hôte ne pourra pas confirmer la remise des clés.") + highlight("Code à 6 chiffres", "482193"), rows([["Résidence", "Villa Cocody"]]))],
      ["pay-host", "Payer l’hôte", layout("Paiement", "C’est le moment de payer l’hôte", paras("Bonjour,", "L’hôte a confirmé le code clé. Payez-le maintenant depuis Maresi, via Wave ou Orange Money.", "Une fois le paiement envoyé, déclarez-le dans l’application pour que l’hôte puisse confirmer."), rows([["Moyen", "Wave ou Orange Money"], ["À faire", "Payer l’hôte, puis déclarer"]]), "Payer maintenant")],
      ["extension-requested", "Prolongation demandée", layout("Prolongation", "Awa Kouassi veut rester plus longtemps", paras("Bonjour,", "Awa Kouassi souhaite prolonger son séjour. Vérifiez vos disponibilités, puis acceptez ou refusez.", "S’il y a déjà une réservation derrière, refusez pour éviter un chevauchement."), rows([["Voyageur", "Awa Kouassi"], ["Résidence", "Villa Cocody"], ["Nouveau départ", "2026-09-18"], ["Supplément", "45000 XOF"]]), "Répondre à la demande")],
      ["extension-accepted", "Prolongation acceptée", layout("Prolongation", "Votre prolongation est acceptée", paras("Bonjour,", "L’hôte a accepté de prolonger votre séjour. Payez le supplément directement à l’hôte, puis déclarez le paiement dans Maresi.", "Le nouveau départ s’applique seulement après confirmation de l’hôte."), rows([["Résidence", "Villa Cocody"], ["Nouveau départ", "2026-09-18"]]))],
      ["extension-declined", "Prolongation refusée", layout("Prolongation", "La prolongation n’a pas été acceptée", paras("Bonjour,", "L’hôte a refusé de prolonger votre séjour. La date de départ initiale reste valable.", "Prévoyez de libérer la résidence à l’heure indiquée pour éviter un dépassement facturé."), rows([["Résidence", "Villa Cocody"]]))],
      ["overstay", "Dépassement", layout("Dépassement", "Des nuits supplémentaires sont dues", paras("Bonjour,", "Votre séjour a dépassé la date de départ. L’hôte a facturé les nuits en plus.", "Payez ce montant à l’hôte pour régulariser votre présence jusqu’à la nouvelle date."), rows([["Nouveau départ", "2026-09-16"], ["Montant dû", "30000 XOF"]]), "Payer le dépassement")],
      ["host-apply-sent", "Demande hôte envoyée", layout("Compte hôte", "Nous avons bien reçu votre demande", paras("Bonjour,", "Votre demande pour devenir hôte est en cours de vérification.", "Nous vous écrivons dès qu’un administrateur Maresi l’accepte ou la refuse. Vous pourrez alors publier vos résidences."))],
      ["host-apply-admin", "Demande hôte admin", layout("Admin", "Une demande hôte attend votre avis", paras("Bonjour,", "Une personne souhaite devenir hôte. Vérifiez son identité, puis acceptez ou refusez dans l’espace admin."), rows([["Nom", "Awa Kouassi"], ["Téléphone", "+225 01 23 45 67 89"]]))],
      ["host-activated", "Compte hôte activé", layout("Compte hôte", "Vous pouvez publier vos résidences", paras("Bonjour,", "Votre demande a été acceptée. Votre compte hôte est actif.", "Ouvrez Maresi Hôte, ajoutez vos photos, vos tarifs et vos moyens de paiement, puis recevez vos premières demandes."), "", "Ouvrir Maresi Hôte")],
      ["host-refused", "Demande hôte refusée", layout("Compte hôte", "Votre demande n’a pas été acceptée", paras("Bonjour,", "Votre demande pour devenir hôte n’a pas été retenue pour le moment.", "Vous pouvez rester sur Maresi en tant que voyageur, ou déposer une nouvelle demande plus tard avec un dossier plus complet."))],
      ["review", "Nouvel avis", layout("Avis", "Un voyageur a noté votre résidence", paras("Bonjour,", "Un avis vient d’être publié. Les notes aident les prochains voyageurs à vous choisir.", "Merci de continuer à soigner l’accueil et l’état du logement."), rows([["Résidence", "Villa Cocody"], ["Note", "5 / 5"], ["Voyageur", "Koffi Mensah"], ["Commentaire", "Calme, propre, parfait."]]))],
      ["checkin-guest", "Arrivée client", layout("Séjour", "Votre arrivée commence maintenant", paras("Bonjour,", "C’est l’heure. Présentez-vous à la résidence avec votre pièce d’identité et le code clé si l’hôte le demande.", "Si vous êtes en retard, prévenez l’hôte directement."), rows([["Résidence", "Villa Cocody"]]))],
      ["checkin-host", "Arrivée hôte", layout("Séjour", "Le client arrive aujourd’hui", paras("Bonjour,", "C’est l’heure d’arrivée. Préparez la clé et vérifiez que la résidence est prête.", "Demandez le code à 6 chiffres avant de remettre les accès, si ce n’est pas déjà fait."), rows([["Résidence", "Villa Cocody"]]))],
      ["checkout-guest", "Départ client", layout("Séjour", "Votre départ est maintenant", paras("Bonjour,", "C’est l’heure de quitter la résidence. Laissez les lieux propres, refermez et rendez la clé à l’hôte.", "Un départ en retard peut être facturé en nuits supplémentaires."), rows([["Résidence", "Villa Cocody"]]))],
      ["checkout-host", "Départ hôte", layout("Séjour", "Le client doit quitter aujourd’hui", paras("Bonjour,", "C’est l’heure du départ. Vérifiez l’état de la résidence après le séjour.", "S’il reste, facturez le dépassement puis clôturez le séjour avec votre note hôte."), rows([["Résidence", "Villa Cocody"]]))],
    ];

    const nav = document.getElementById("nav");
    const grid = document.getElementById("grid");
    cases.forEach(([id, label, html]) => {
      nav.insertAdjacentHTML("beforeend", `<a href="#${id}">${label}</a>`);
      grid.insertAdjacentHTML("beforeend", `<section id="${id}"><div class="label">${label}</div><iframe></iframe></section>`);
      grid.querySelector(`#${id} iframe`).srcdoc = html;
    });
  </script>
</body>
</html>
