server.port=${PORT:4000}

spring.config.import=optional:classpath:application-local.properties

# Neon / Render: postgresql://… is converted to jdbc in DatabaseConfig.
# Local: jdbc:postgresql://localhost:5432/Maresi
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/Maresi}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000

maresi.jwt.secret=${JWT_SECRET:maresi-dev-only-jwt-secret-not-for-production}
maresi.jwt.expires-in=${JWT_EXPIRES_IN:7d}
maresi.dev-auth-bypass=${DEV_AUTH_BYPASS:false}
maresi.upload-dir=${UPLOAD_DIR:uploads}
maresi.sms.provider=${SMS_PROVIDER:mock}
maresi.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
maresi.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
maresi.sms.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

maresi.geniuspay.api-key=${GENIUSPAY_API_KEY:}
maresi.geniuspay.api-secret=${GENIUSPAY_API_SECRET:}
maresi.geniuspay.webhook-secret=${GENIUSPAY_WEBHOOK_SECRET:}
maresi.geniuspay.base-url=${GENIUSPAY_BASE_URL:https://pay.genius.ci/api/v1/merchant}
maresi.geniuspay.payout-wallet-id=${GENIUSPAY_PAYOUT_WALLET_ID:}
maresi.payments.owner-subscription-fcfa=${OWNER_SUBSCRIPTION_FCFA:10000}
maresi.payments.reservation-commission-percent=${RESERVATION_COMMISSION_PERCENT:0}
maresi.payments.success-url=${PAYMENT_SUCCESS_URL:http://localhost:3000/payments/success}
maresi.payments.error-url=${PAYMENT_ERROR_URL:http://localhost:3000/payments/error}
maresi.payments.host-success-url=${PAYMENT_HOST_SUCCESS_URL:}
maresi.payments.host-error-url=${PAYMENT_HOST_ERROR_URL:}
maresi.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
maresi.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
maresi.push.subject=${VAPID_SUBJECT:mailto:maresi00225@gmail.com}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

spring.messages.basename=errorMessage
spring.messages.encoding=UTF-8

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
