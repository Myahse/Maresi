services:
  - type: web
    name: maresi-api
    runtime: docker
    rootDir: Maresi
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: SMS_PROVIDER
        value: mock
      - key: UPLOAD_DIR
        value: uploads
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: GENIUSPAY_API_KEY
        sync: false
      - key: GENIUSPAY_API_SECRET
        sync: false
      - key: GENIUSPAY_WEBHOOK_SECRET
        sync: false
      - key: GENIUSPAY_PAYOUT_WALLET_ID
        sync: false
      - key: OWNER_SUBSCRIPTION_FCFA
        value: "10000"
      - key: RESERVATION_COMMISSION_PERCENT
        value: "10"
      - key: PAYMENT_SUCCESS_URL
        value: "https://ma-resi.com/payments/success"
      - key: PAYMENT_ERROR_URL
        value: "https://ma-resi.com/payments/error"
      - key: PAYMENT_HOST_SUCCESS_URL
        value: "https://host.ma-resi.com/payments/success"
      - key: PAYMENT_HOST_ERROR_URL
        value: "https://host.ma-resi.com/payments/error"
      - key: CLIENT_APP_URL
        value: "https://ma-resi.com"
      - key: HOST_APP_URL
        value: "https://host.ma-resi.com"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@maresi.app
